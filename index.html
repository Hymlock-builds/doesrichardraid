<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Richard Raids Calendar</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cinzel', serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0a0d14;
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(100,60,180,0.18) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 80%, rgba(30,80,160,0.18) 0%, transparent 60%);
      padding: 30px 16px;
    }
    .uwu-container, .aether-container { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
    .uwu { position:absolute; font-family:'Cinzel',serif; font-size:11px; color:rgba(160,120,48,1); letter-spacing:3px; user-select:none; animation:uwuFade 6s ease-in-out infinite; opacity:0; }
    @keyframes uwuFade { 0%,100%{opacity:0} 20%,80%{opacity:0.07} }
    .aether-particle { position:absolute; border-radius:50%; pointer-events:none; animation:aetherFloat linear infinite; }
    @keyframes aetherFloat {
      0%   { transform:translateY(0) translateX(0) scale(1); opacity:0; }
      10%  { opacity:1; }
      90%  { opacity:0.6; }
      100% { transform:translateY(-120px) translateX(var(--drift)) scale(0.4); opacity:0; }
    }
    .card {
      width:360px;
      background:linear-gradient(160deg,#12172a 0%,#0e1220 100%);
      border:1px solid #a07830;
      border-radius:4px;
      box-shadow:0 0 0 1px #1e2540, 0 0 30px rgba(160,120,48,0.15), 0 20px 60px rgba(0,0,0,0.6);
      overflow:hidden; position:relative; z-index:1; transition:box-shadow 0.6s ease;
    }
    .card.live { animation:borderPulse 2s ease-in-out infinite; }
    .card.vacation { border-color:#4a7aaa; box-shadow:0 0 0 1px #1e2540, 0 0 30px rgba(60,120,200,0.2), 0 20px 60px rgba(0,0,0,0.6); }
    @keyframes borderPulse {
      0%,100% { box-shadow:0 0 0 1px #1e2540,0 0 30px rgba(200,60,60,0.2),0 20px 60px rgba(0,0,0,0.6); border-color:#a07830; }
      50%     { box-shadow:0 0 0 2px #1e2540,0 0 50px rgba(220,60,60,0.55),0 20px 60px rgba(0,0,0,0.6); border-color:#e05030; }
    }
    .card::before,.card::after { content:''; position:absolute; width:18px; height:18px; border-color:#c9942a; border-style:solid; z-index:2; }
    .card::before { top:6px; left:6px; border-width:2px 0 0 2px; }
    .card::after  { bottom:6px; right:6px; border-width:0 2px 2px 0; }
    .corner-tr,.corner-bl { position:absolute; width:18px; height:18px; border-color:#c9942a; border-style:solid; z-index:2; }
    .corner-tr { top:6px; right:6px; border-width:2px 2px 0 0; }
    .corner-bl { bottom:6px; left:6px; border-width:0 0 2px 2px; }
    .header { background:linear-gradient(90deg,transparent,rgba(160,120,48,0.12),transparent); border-bottom:1px solid #a07830; padding:24px 24px 16px; text-align:center; position:relative; }
    .icon-wrap { display:inline-block; position:relative; margin-bottom:12px; }
    .live-ring,.live-ring2 { display:none; position:absolute; border-radius:50%; border:2px solid #e05030; animation:ringPulse 2s ease-in-out infinite; }
    .live-ring  { inset:-6px; }
    .live-ring2 { inset:-12px; border-width:1px; border-color:rgba(220,80,40,0.4); animation-delay:0.4s; }
    .card.live .live-ring,.card.live .live-ring2 { display:block; }
    @keyframes ringPulse { 0%,100%{opacity:0.8;transform:scale(1)} 50%{opacity:0.3;transform:scale(1.1)} }
    .crystal-icon { display:block; width:48px; height:48px; }
    .live-dot { display:none; align-items:center; justify-content:center; gap:6px; margin-bottom:6px; font-size:9px; letter-spacing:3px; color:#e07060; text-transform:uppercase; }
    .live-dot-circle { width:7px; height:7px; border-radius:50%; background:#e05030; animation:dotBlink 1.2s ease-in-out infinite; }
    @keyframes dotBlink { 0%,100%{opacity:1} 50%{opacity:0.2} }
    .card.live .live-dot { display:flex; }
    .title { font-family:'Cinzel Decorative',serif; font-size:11px; letter-spacing:4px; color:#8899cc; text-transform:uppercase; margin-bottom:4px; }
    .question { font-family:'Cinzel Decorative',serif; font-size:20px; font-weight:700; color:#e8d8a0; letter-spacing:1px; }
    .status-section { padding:20px 24px 16px; text-align:center; border-bottom:1px solid rgba(160,120,48,0.3); }
    .status-badge { display:inline-block; padding:8px 20px; border-radius:2px; font-size:13px; letter-spacing:2px; font-weight:600; text-transform:uppercase; }
    .status-badge.raid       { background:rgba(180,50,50,0.2);   border:1px solid #c84040; color:#f08080; }
    .status-badge.raid-today { background:rgba(160,120,20,0.15); border:1px solid #a07830; color:#e8d070; }
    .status-badge.no-raid    { background:rgba(40,130,80,0.15);  border:1px solid #2a8040; color:#60c080; }
    .status-badge.vacation   { background:rgba(40,90,160,0.15);  border:1px solid #4a7aaa; color:#80b8e8; }
    .vacation-info { font-size:10px; letter-spacing:2px; color:#5588aa; margin-top:8px; }
    .countdown-section { padding:16px 24px; text-align:center; border-bottom:1px solid rgba(160,120,48,0.3); }
    .countdown-label { font-size:9px; letter-spacing:3px; color:#5566aa; text-transform:uppercase; margin-bottom:10px; }
    .countdown-display { display:flex; justify-content:center; gap:8px; }
    .cd-block { display:flex; flex-direction:column; align-items:center; }
    .cd-num { background:rgba(160,120,48,0.1); border:1px solid rgba(160,120,48,0.4); border-radius:3px; width:52px; font-size:26px; font-weight:700; color:#e8d070; line-height:1; padding:8px 4px 6px; font-variant-numeric:tabular-nums; transition:border-color 0.4s,color 0.4s; }
    .card.live .cd-num    { border-color:rgba(200,80,60,0.5); color:#f09080; }
    .card.vacation .cd-num { border-color:rgba(60,120,200,0.4); color:#80b8e8; }
    .cd-sep { font-size:24px; color:rgba(160,120,48,0.5); align-self:flex-start; padding-top:8px; line-height:1; }
    .cd-unit { font-size:8px; letter-spacing:1.5px; color:#5566aa; margin-top:5px; text-transform:uppercase; }
    .next-raid-label { font-size:10px; letter-spacing:2px; color:#8899cc; margin-top:10px; }
    .tz-label { font-size:8px; letter-spacing:2px; color:rgba(100,110,160,0.5); text-transform:uppercase; margin-top:8px; }
    .schedule-toggle { width:100%; background:none; border:none; border-bottom:1px solid rgba(160,120,48,0.3); padding:12px 24px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; font-family:'Cinzel',serif; font-size:9px; letter-spacing:3px; color:#8090c0; text-transform:uppercase; transition:background 0.2s,color 0.2s; }
    .schedule-toggle:hover { background:rgba(160,120,48,0.07); color:#c9a050; }
    .toggle-arrow { font-size:10px; transition:transform 0.25s; }
    .toggle-arrow.open { transform:rotate(180deg); }
    .week { max-height:0; overflow:hidden; transition:max-height 0.35s ease; }
    .week.open { max-height:400px; }
    .day-row { display:flex; justify-content:space-between; align-items:center; padding:9px 24px; border-bottom:1px solid rgba(255,255,255,0.04); font-size:11px; letter-spacing:1px; }
    .day-row.today-row { background:rgba(160,120,48,0.07); }
    .day-name { color:#8899bb; font-weight:600; }
    .day-time { font-size:10px; letter-spacing:1px; }
    .raid-time { color:#e07060; }
    .no-raid-time { color:#4a6a4a; }
    .day-dot { width:7px; height:7px; border-radius:50%; margin-right:8px; flex-shrink:0; }
    .dot-raid { background:#c84040; }
    .dot-noraid { background:#2a7040; }
    .day-left { display:flex; align-items:center; }

    .vac-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:100; align-items:center; justify-content:center; padding:20px; }
    .vac-overlay.open { display:flex; }
    .vac-modal { background:linear-gradient(160deg,#12172a,#0e1220); border:1px solid #4a7aaa; border-radius:4px; padding:26px 26px 22px; width:330px; max-height:90vh; overflow-y:auto; text-align:center; box-shadow:0 0 40px rgba(60,120,200,0.2); position:relative; }
    .vac-modal::before,.vac-modal::after { content:''; position:absolute; width:14px; height:14px; border-color:#4a7aaa; border-style:solid; }
    .vac-modal::before { top:5px; left:5px; border-width:1px 0 0 1px; }
    .vac-modal::after  { bottom:5px; right:5px; border-width:0 1px 1px 0; }
    .vac-title { font-family:'Cinzel Decorative',serif; font-size:14px; color:#80b8e8; letter-spacing:3px; margin-bottom:4px; }
    .vac-sub { font-size:9px; letter-spacing:2px; color:#5577aa; text-transform:uppercase; margin-bottom:20px; }

    .admin-section-label { font-size:9px; letter-spacing:3px; color:#80b8e8; text-transform:uppercase; margin-bottom:10px; text-align:left; border-bottom:1px solid rgba(74,122,170,0.2); padding-bottom:5px; }
    .admin-divider { height:1px; background:rgba(74,122,170,0.2); margin:16px 0; }

    .sched-editor { text-align:left; margin-bottom:12px; }
    .sched-row { display:flex; align-items:center; justify-content:space-between; padding:4px 0; gap:8px; }
    .sched-day { display:flex; align-items:center; gap:7px; font-size:11px; color:#a8b8d8; letter-spacing:1px; cursor:pointer; min-width:52px; user-select:none; }
    .sched-check { accent-color:#4a7aaa; cursor:pointer; width:14px; height:14px; }
    .sched-times { display:flex; align-items:center; gap:4px; }
    .sched-dash { color:#5577aa; font-size:11px; }
    .sched-time { background:rgba(60,100,160,0.08); border:1px solid rgba(74,122,170,0.4); border-radius:3px; color:#a8c8e8; font-family:'Cinzel',serif; font-size:11px; padding:3px 4px; }
    .sched-time:disabled { opacity:0.25; }
    .sched-time:focus { outline:none; border-color:#80b8e8; }
    .sched-time::-webkit-calendar-picker-indicator { filter:invert(0.7); cursor:pointer; }

    .vac-days-label { font-size:9px; letter-spacing:2px; color:#5577aa; text-transform:uppercase; margin-bottom:10px; }
    .vac-days-input { background:rgba(60,100,160,0.1); border:1px solid #4a7aaa; border-radius:3px; color:#80b8e8; font-family:'Cinzel',serif; font-size:22px; text-align:center; width:80px; padding:8px 4px; }
    .vac-days-input:focus { outline:none; border-color:#80b8e8; }
    .vac-btn-row { display:flex; gap:10px; margin-top:14px; justify-content:center; }
    .vac-btn { font-family:'Cinzel',serif; font-size:9px; letter-spacing:2px; text-transform:uppercase; padding:8px 16px; border-radius:2px; cursor:pointer; border:1px solid; transition:background 0.2s; }
    .vac-btn.confirm { background:rgba(60,100,160,0.2); border-color:#4a7aaa; color:#80b8e8; }
    .vac-btn.confirm:hover { background:rgba(60,100,160,0.35); }
    .vac-btn.cancel  { background:rgba(160,120,48,0.1); border-color:#a07830; color:#c9a050; }
    .vac-btn.cancel:hover { background:rgba(160,120,48,0.2); }
    .vac-btn.end { background:rgba(160,50,50,0.15); border-color:#c84040; color:#f08080; }
    .vac-btn.end:hover { background:rgba(160,50,50,0.3); }
    .sched-save-btn { width:100%; }
    .sched-saved-note { font-size:8px; letter-spacing:2px; color:#60c080; text-transform:uppercase; margin-top:8px; height:10px; opacity:0; transition:opacity 0.3s; }
    .sched-saved-note.show { opacity:1; }

    .vac-trigger { width:100%; background:none; border:none; border-top:1px solid rgba(160,120,48,0.2); padding:10px 24px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; font-family:'Cinzel',serif; font-size:8px; letter-spacing:3px; color:rgba(100,110,160,0.45); text-transform:uppercase; transition:background 0.2s,color 0.2s; }
    .vac-trigger:hover { background:rgba(60,100,200,0.06); color:#6688bb; }
    .footer { padding:10px 24px 12px; text-align:center; font-size:8px; letter-spacing:2px; color:rgba(100,110,160,0.4); text-transform:uppercase; cursor:default; }
  </style>
</head>
<body>

<div class="uwu-container" id="uwu-container"></div>
<div class="aether-container" id="aether-container"></div>

<div class="card" id="card">
  <div class="corner-tr"></div>
  <div class="corner-bl"></div>
  <div class="header">
    <div class="live-dot"><div class="live-dot-circle"></div>Raid Live</div>
    <div class="icon-wrap">
      <div class="live-ring"></div>
      <div class="live-ring2"></div>
      <svg class="crystal-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g transform="rotate(-8,24,24)">
          <rect x="6" y="6" width="36" height="36" rx="6" fill="#b8a030"/>
          <rect x="6" y="6" width="36" height="36" rx="6" fill="url(#ss)"/>
          <rect x="8" y="8" width="32" height="32" rx="5" fill="none" stroke="#e8d060" stroke-width="1.2" opacity="0.5"/>
          <rect x="10" y="10" width="28" height="28" rx="4" fill="#9a8820" opacity="0.6"/>
          <circle cx="24" cy="24" r="9" fill="none" stroke="#f0e040" stroke-width="2" opacity="0.9"/>
          <line x1="17" y1="31" x2="31" y2="17" stroke="#f0e040" stroke-width="2.2" stroke-linecap="round" opacity="0.95"/>
          <circle cx="24" cy="24" r="2" fill="#fff8a0" opacity="0.7"/>
        </g>
        <defs>
          <radialGradient id="ss" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#e8d060" stop-opacity="0.3"/>
            <stop offset="60%" stop-color="#b8a030" stop-opacity="0"/>
            <stop offset="100%" stop-color="#504010" stop-opacity="0.5"/>
          </radialGradient>
        </defs>
      </svg>
    </div>
    <div class="title">Eorzea Raid Tracker</div>
    <div class="question">Does He Raid?</div>
  </div>

  <div class="status-section">
    <span id="status-badge" class="status-badge">—</span>
    <div class="vacation-info" id="vac-info" style="display:none;"></div>
  </div>

  <div class="countdown-section">
    <div class="countdown-label" id="cd-label">Next Raid Begins In</div>
    <div class="countdown-display">
      <div class="cd-block"><div class="cd-num" id="cd-days">00</div><div class="cd-unit">Days</div></div>
      <div class="cd-sep">:</div>
      <div class="cd-block"><div class="cd-num" id="cd-hours">00</div><div class="cd-unit">Hours</div></div>
      <div class="cd-sep">:</div>
      <div class="cd-block"><div class="cd-num" id="cd-mins">00</div><div class="cd-unit">Mins</div></div>
      <div class="cd-sep">:</div>
      <div class="cd-block"><div class="cd-num" id="cd-secs">00</div><div class="cd-unit">Secs</div></div>
    </div>
    <div class="next-raid-label" id="next-label">—</div>
    <div class="tz-label">All times Eastern (EST)</div>
  </div>

  <button class="schedule-toggle" onclick="toggleWeek()">
    View Full Schedule <span class="toggle-arrow" id="arrow">▾</span>
  </button>

  <div class="week" id="week"></div>

  <button class="vac-trigger" id="vac-trigger" style="display:none;" onclick="openAdminModal()">⚓ Admin Panel</button>
  <div class="footer" id="footer-text">Gunbreaking Out</div>
</div>

<!-- Admin Modal -->
<div class="vac-overlay" id="admin-overlay">
  <div class="vac-modal">
    <div class="vac-title">Admin Panel</div>
    <div class="vac-sub">Manage raid schedule &amp; vacation</div>

    <div class="admin-section-label">Raid Schedule (EST)</div>
    <div class="sched-editor" id="sched-editor">
      <div class="sched-row"><label class="sched-day"><input type="checkbox" class="sched-check" data-day="0"><span>Sun</span></label><div class="sched-times"><input type="time" class="sched-time sched-start" data-day="0" value="20:00"><span class="sched-dash">–</span><input type="time" class="sched-time sched-end" data-day="0" value="23:00"></div></div>
      <div class="sched-row"><label class="sched-day"><input type="checkbox" class="sched-check" data-day="1"><span>Mon</span></label><div class="sched-times"><input type="time" class="sched-time sched-start" data-day="1" value="20:00"><span class="sched-dash">–</span><input type="time" class="sched-time sched-end" data-day="1" value="23:00"></div></div>
      <div class="sched-row"><label class="sched-day"><input type="checkbox" class="sched-check" data-day="2"><span>Tue</span></label><div class="sched-times"><input type="time" class="sched-time sched-start" data-day="2" value="20:00"><span class="sched-dash">–</span><input type="time" class="sched-time sched-end" data-day="2" value="23:00"></div></div>
      <div class="sched-row"><label class="sched-day"><input type="checkbox" class="sched-check" data-day="3"><span>Wed</span></label><div class="sched-times"><input type="time" class="sched-time sched-start" data-day="3" value="20:00"><span class="sched-dash">–</span><input type="time" class="sched-time sched-end" data-day="3" value="23:00"></div></div>
      <div class="sched-row"><label class="sched-day"><input type="checkbox" class="sched-check" data-day="4"><span>Thu</span></label><div class="sched-times"><input type="time" class="sched-time sched-start" data-day="4" value="20:00"><span class="sched-dash">–</span><input type="time" class="sched-time sched-end" data-day="4" value="23:00"></div></div>
      <div class="sched-row"><label class="sched-day"><input type="checkbox" class="sched-check" data-day="5"><span>Fri</span></label><div class="sched-times"><input type="time" class="sched-time sched-start" data-day="5" value="20:00"><span class="sched-dash">–</span><input type="time" class="sched-time sched-end" data-day="5" value="23:00"></div></div>
      <div class="sched-row"><label class="sched-day"><input type="checkbox" class="sched-check" data-day="6"><span>Sat</span></label><div class="sched-times"><input type="time" class="sched-time sched-start" data-day="6" value="20:00"><span class="sched-dash">–</span><input type="time" class="sched-time sched-end" data-day="6" value="23:00"></div></div>
    </div>
    <button class="vac-btn confirm sched-save-btn" onclick="saveSchedule()">Save Schedule</button>
    <div class="sched-saved-note" id="sched-saved-note">Schedule saved ✓</div>

    <div class="admin-divider"></div>

    <div class="admin-section-label">Vacation Mode</div>
    <div class="vac-days-label">How many days?</div>
    <input class="vac-days-input" type="number" id="vac-days-input" min="1" max="365" value="7"/>
    <div class="vac-btn-row">
      <button class="vac-btn confirm" onclick="setVacation()">Activate</button>
      <button class="vac-btn end" id="end-vac-btn" onclick="endVacation()" style="display:none;">End Early</button>
    </div>

    <div class="admin-divider"></div>
    <button class="vac-btn cancel" onclick="closeAdminModal()">Close</button>
  </div>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBI12RKjtjm7Ea5hX8UJmMA15Lwq1XyvXc",
    authDomain: "doesrichardraid.firebaseapp.com",
    projectId: "doesrichardraid",
    storageBucket: "doesrichardraid.firebasestorage.app",
    messagingSenderId: "640272039871",
    appId: "1:640272039871:web:62aa9573a7cbcede2ceb0a",
    measurementId: "G-T63M2PMQ5H"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);
  const vacDoc   = doc(db, 'settings', 'vacation');
  const schedDoc = doc(db, 'settings', 'schedule');

  window._setDoc    = setDoc;
  window._deleteDoc = deleteDoc;
  window._vacDoc    = vacDoc;
  window._schedDoc  = schedDoc;

  // Vacation listener — syncs instantly across everyone
  onSnapshot(vacDoc, (snap) => {
    window._vacEnd = (snap.exists() && snap.data().endsAt) ? snap.data().endsAt : null;
    if (window.renderTick) window.renderTick();
  });

  // Schedule listener — syncs instantly across everyone
  onSnapshot(schedDoc, (snap) => {
    if (snap.exists() && Array.isArray(snap.data().raids) && snap.data().raids.length) {
      window._schedule = snap.data().raids;
    } else {
      window._schedule = window._defaultRaids;
    }
    if (window.renderWeek) window.renderWeek();
    if (window.renderTick) window.renderTick();
  });
</script>

<script>
  // Default schedule (used until Firebase responds or if none set)
  window._defaultRaids = [
    { day:2, startH:20, startM:0, endH:23, endM:0 },
    { day:3, startH:20, startM:0, endH:23, endM:0 },
    { day:4, startH:20, startM:0, endH:23, endM:0 },
  ];
  window._schedule = window._defaultRaids;
  window._vacEnd = null;

  const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const DAY_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  const card      = document.getElementById('card');
  const badge     = document.getElementById('status-badge');
  const cdLabel   = document.getElementById('cd-label');
  const nextLabel = document.getElementById('next-label');
  const vacInfo   = document.getElementById('vac-info');

  function pad(n) { return String(n).padStart(2,'0'); }
  function getEST(now) { return new Date(now.toLocaleString('en-US',{timeZone:'America/New_York'})); }
  function getRaids() { return window._schedule || window._defaultRaids; }
  function fmtTime(h, m) { return (h % 12 || 12) + ':' + pad(m) + ' ' + (h >= 12 ? 'PM' : 'AM'); }

  function getCurrentRaid(now) {
    const est=getEST(now), day=est.getDay(), mins=est.getHours()*60+est.getMinutes();
    for (const r of getRaids()) if (r.day===day && mins>=r.startH*60+r.startM && mins<r.endH*60+r.endM) return r;
    return null;
  }
  function isRaidDay(now) { return getRaids().some(r=>r.day===getEST(now).getDay()); }
  function getNextRaid(now) {
    const est=getEST(now); let best=null,bestDiff=Infinity;
    for (const r of getRaids()) for (let w=0;w<=1;w++) {
      const t=new Date(est);
      let d=(r.day-est.getDay()+7)%7+w*7;
      if(d===0&&est.getHours()*60+est.getMinutes()>=r.startH*60+r.startM) d=7;
      t.setDate(est.getDate()+d); t.setHours(r.startH,r.startM,0,0);
      const diff=t-est;
      if(diff>0&&diff<bestDiff){bestDiff=diff;best={...r,target:t};}
    }
    return best;
  }

  // Build the weekly schedule rows from the current schedule
  function renderWeek() {
    const raids = getRaids();
    const today = getEST(new Date()).getDay();
    const weekEl = document.getElementById('week');
    weekEl.innerHTML = '';
    for (let i=0;i<=6;i++) {
      const raid = raids.find(r=>r.day===i);
      const row = document.createElement('div');
      row.className = 'day-row' + (i===today ? ' today-row' : '');
      if (i===6) row.style.borderBottom='none';
      const dotClass  = raid ? 'dot-raid' : 'dot-noraid';
      const timeClass = raid ? 'raid-time' : 'no-raid-time';
      const timeText  = raid ? (fmtTime(raid.startH,raid.startM)+' – '+fmtTime(raid.endH,raid.endM)) : 'No Raid';
      row.innerHTML = '<div class="day-left"><div class="day-dot '+dotClass+'"></div><span class="day-name">'+DAY_NAMES[i]+'</span></div><span class="day-time '+timeClass+'">'+timeText+'</span>';
      weekEl.appendChild(row);
    }
  }
  window.renderWeek = renderWeek;

  function isOnVacation() { return window._vacEnd && Date.now() < window._vacEnd; }

  function renderTick() {
    const now=new Date(), est=getEST(now);

    if (isOnVacation()) {
      const ts = Math.floor((window._vacEnd - Date.now())/1000);
      const d=Math.floor(ts/86400), h=Math.floor((ts%86400)/3600), m=Math.floor((ts%3600)/60), s=ts%60;
      card.classList.remove('live'); card.classList.add('vacation');
      badge.textContent='On Vacation'; badge.className='status-badge vacation';
      vacInfo.style.display='block';
      vacInfo.textContent='Returns in '+d+'d '+pad(h)+'h '+pad(m)+'m';
      cdLabel.textContent='Vacation Ends In';
      document.getElementById('cd-days').textContent=pad(d);
      document.getElementById('cd-hours').textContent=pad(h);
      document.getElementById('cd-mins').textContent=pad(m);
      document.getElementById('cd-secs').textContent=pad(s);
      nextLabel.textContent='No raids until Richard returns';
      return;
    }

    card.classList.remove('vacation');
    vacInfo.style.display='none';
    const active=getCurrentRaid(now);
    card.classList.toggle('live',!!active);

    if (active) {
      badge.textContent="It's Happening Now"; badge.className='status-badge raid';
      const end=new Date(est); end.setHours(active.endH,active.endM,0,0);
      const ts=Math.max(0,Math.floor((end-est)/1000));
      cdLabel.textContent='Raid Ends In';
      document.getElementById('cd-days').textContent='00';
      document.getElementById('cd-hours').textContent=pad(Math.floor(ts/3600));
      document.getElementById('cd-mins').textContent=pad(Math.floor((ts%3600)/60));
      document.getElementById('cd-secs').textContent=pad(ts%60);
      nextLabel.textContent=DAY_NAMES[active.day]+' raid ends at '+fmtTime(active.endH,active.endM);
    } else {
      badge.className=isRaidDay(now)?'status-badge raid-today':'status-badge no-raid';
      badge.textContent=isRaidDay(now)?'Raid Tonight!':'No Raid Today';
      const next=getNextRaid(now);
      if(next){
        const ts=Math.floor((next.target-est)/1000);
        cdLabel.textContent='Next Raid Begins In';
        document.getElementById('cd-days').textContent=pad(Math.floor(ts/86400));
        document.getElementById('cd-hours').textContent=pad(Math.floor((ts%86400)/3600));
        document.getElementById('cd-mins').textContent=pad(Math.floor((ts%3600)/60));
        document.getElementById('cd-secs').textContent=pad(ts%60);
        nextLabel.textContent=DAY_SHORT[next.target.getDay()]+' at '+fmtTime(next.startH,next.startM);
      } else {
        cdLabel.textContent='Next Raid'; nextLabel.textContent='No raids scheduled';
        ['cd-days','cd-hours','cd-mins','cd-secs'].forEach(id=>document.getElementById(id).textContent='00');
      }
    }
  }
  window.renderTick = renderTick;

  function toggleWeek() {
    document.getElementById('week').classList.toggle('open');
    document.getElementById('arrow').classList.toggle('open');
  }
  window.toggleWeek = toggleWeek;

  /* ---------- Admin modal ---------- */
  function toggleTimeInputs(day) {
    const cb = document.querySelector('.sched-check[data-day="'+day+'"]');
    const start = document.querySelector('.sched-start[data-day="'+day+'"]');
    const end = document.querySelector('.sched-end[data-day="'+day+'"]');
    start.disabled = !cb.checked;
    end.disabled = !cb.checked;
  }
  function populateEditor() {
    const raids = getRaids();
    for (let i=0;i<=6;i++) {
      const raid = raids.find(r=>r.day===i);
      const cb = document.querySelector('.sched-check[data-day="'+i+'"]');
      const start = document.querySelector('.sched-start[data-day="'+i+'"]');
      const end = document.querySelector('.sched-end[data-day="'+i+'"]');
      cb.checked = !!raid;
      if (raid) {
        start.value = pad(raid.startH)+':'+pad(raid.startM);
        end.value   = pad(raid.endH)+':'+pad(raid.endM);
      }
      toggleTimeInputs(i);
    }
  }
  function openAdminModal() {
    populateEditor();
    document.getElementById('end-vac-btn').style.display = isOnVacation() ? 'inline-block' : 'none';
    document.getElementById('sched-saved-note').classList.remove('show');
    document.getElementById('admin-overlay').classList.add('open');
  }
  function closeAdminModal() { document.getElementById('admin-overlay').classList.remove('open'); }

  async function saveSchedule() {
    const newRaids = [];
    document.querySelectorAll('.sched-check').forEach(cb => {
      if (cb.checked) {
        const day = parseInt(cb.dataset.day);
        const start = document.querySelector('.sched-start[data-day="'+day+'"]').value || '20:00';
        const end   = document.querySelector('.sched-end[data-day="'+day+'"]').value || '23:00';
        const [sh,sm] = start.split(':').map(Number);
        const [eh,em] = end.split(':').map(Number);
        newRaids.push({ day, startH:sh, startM:sm, endH:eh, endM:em });
      }
    });
    try {
      await window._setDoc(window._schedDoc, { raids: newRaids });
      const note = document.getElementById('sched-saved-note');
      note.classList.add('show');
      setTimeout(()=>note.classList.remove('show'), 2500);
    } catch(e) {
      alert('Could not save schedule. Check your connection.');
    }
  }

  async function setVacation() {
    const days = Math.max(1, parseInt(document.getElementById('vac-days-input').value) || 1);
    await window._setDoc(window._vacDoc, { endsAt: Date.now() + days * 86400000 });
    closeAdminModal();
  }
  async function endVacation() { await window._deleteDoc(window._vacDoc); closeAdminModal(); }

  window.openAdminModal  = openAdminModal;
  window.closeAdminModal = closeAdminModal;
  window.saveSchedule    = saveSchedule;
  window.setVacation     = setVacation;
  window.endVacation     = endVacation;

  // Live enable/disable of time inputs
  document.querySelectorAll('.sched-check').forEach(cb => {
    cb.addEventListener('change', () => toggleTimeInputs(parseInt(cb.dataset.day)));
  });

  /* ---------- Secret footer trigger (15 clicks) ---------- */
  let footerClicks=0, footerTimer=null;
  document.getElementById('footer-text').addEventListener('click',()=>{
    footerClicks++;
    clearTimeout(footerTimer);
    if(footerClicks>=15){
      footerClicks=0;
      document.getElementById('vac-trigger').style.display='block';
      openAdminModal();
    } else {
      footerTimer=setTimeout(()=>{footerClicks=0;},3000);
    }
  });

  /* ---------- UwU spawner ---------- */
  const uwuContainer=document.getElementById('uwu-container');
  function spawnUwU(){
    const el=document.createElement('div'); el.className='uwu'; el.textContent='UwU';
    el.style.cssText='left:'+Math.random()*95+'%;top:'+Math.random()*95+'%;font-size:'+(9+Math.random()*10).toFixed(1)+'px;animation-duration:'+(5+Math.random()*6).toFixed(1)+'s;transform:rotate('+(Math.random()*40-20).toFixed(1)+'deg)';
    uwuContainer.appendChild(el); setTimeout(()=>el.remove(),12000);
  }
  setInterval(spawnUwU,2200); setTimeout(spawnUwU,800);

  /* ---------- Aether particles ---------- */
  const aetherContainer=document.getElementById('aether-container');
  const aetherColors=['rgba(140,100,255,VAL)','rgba(80,160,255,VAL)','rgba(160,220,255,VAL)','rgba(200,180,255,VAL)','rgba(100,200,220,VAL)','rgba(220,200,255,VAL)'];
  function spawnAether(){
    const el=document.createElement('div'); el.className='aether-particle';
    const size=2+Math.random()*4, opacity=(0.3+Math.random()*0.5).toFixed(2);
    const color=aetherColors[Math.floor(Math.random()*aetherColors.length)].replace('VAL',opacity);
    const duration=4+Math.random()*8, drift=(Math.random()*60-30).toFixed(0)+'px';
    el.style.cssText=['left:'+(Math.random()*100)+'%','top:'+(60+Math.random()*40)+'%','width:'+size+'px','height:'+size+'px','background:'+color,'box-shadow:0 0 '+(size*2)+'px '+color,'--drift:'+drift,'animation-duration:'+duration.toFixed(1)+'s','animation-delay:'+(Math.random()*4).toFixed(1)+'s'].join(';');
    aetherContainer.appendChild(el); setTimeout(()=>el.remove(),(duration+4)*1000);
  }
  setInterval(spawnAether,400);
  for(let i=0;i<12;i++) setTimeout(spawnAether,i*200);

  /* ---------- Initial render + tick ---------- */
  renderWeek();
  renderTick();
  setInterval(renderTick, 1000);
</script>
</body>
</html>
